<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#333333">
  <!-- Android robot head: half circle with antennas and eyes -->
  <!-- Antennas -->
  <rect x="18" y="6" width="3" height="12" rx="1.5" transform="rotate(-20 19.5 12)"/>
  <rect x="43" y="6" width="3" height="12" rx="1.5" transform="rotate(20 44.5 12)"/>
  <!-- Head (half circle) -->
  <path d="M8 38a24 24 0 0 1 48 0z"/>
  <!-- Eyes -->
  <circle cx="22" cy="30" r="3" fill="white"/>
  <circle cx="42" cy="30" r="3" fill="white"/>
  <!-- Body -->
  <rect x="8" y="40" width="48" height="18" rx="4"/>
  <!-- Arms -->
  <rect x="0" y="40" width="6" height="14" rx="3"/>
  <rect x="58" y="40" width="6" height="14" rx="3"/>
</svg>
