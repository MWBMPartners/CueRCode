<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#333333" stroke-width="3">
  <!-- Globe/world icon with latitude/longitude lines -->
  <circle cx="32" cy="32" r="28"/>
  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="12" ry="28"/>
  <!-- Latitude lines -->
  <line x1="4" y1="22" x2="60" y2="22"/>
  <line x1="4" y1="42" x2="60" y2="42"/>
  <!-- Equator -->
  <line x1="4" y1="32" x2="60" y2="32"/>
</svg>
