<!DOCTYPE html>
<!--
================================================================================
📴 CueRCode - Offline Fallback Page
================================================================================

Minimal self-contained HTML page displayed by the service worker when the
user is offline and no cached version of the requested page is available.
No external dependencies (no PHP, no CDN, no external CSS/JS).

All styles are inline so this page can render without any network access.
Supports both light and dark colour schemes via prefers-color-scheme.

@package     CueRCode
@subpackage  ServiceWorker
@version     1.0.0
@since       Phase 1
@see         https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-color-scheme
@see         https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API
================================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Offline - CueRCode</title>

    <!-- ====================================================================
         🎨 Inline Styles - No External Dependencies
         ==================================================================== -->
    <style>
        /* ==================================================================
           🎨 CSS Custom Properties
           ================================================================== */

        :root {
            --offline-primary: #2c7a7b;
            --offline-primary-light: #38a89d;
            --offline-primary-dark: #1a4a4a;
            --offline-bg: #f8f9fa;
            --offline-surface: #ffffff;
            --offline-text: #212529;
            --offline-text-muted: #6c757d;
            --offline-border: #dee2e6;
            --offline-shadow: rgba(0, 0, 0, 0.08);
        }

        /* ==================================================================
           🌙 Dark Mode Overrides
           @see https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-color-scheme
           ================================================================== */

        @media (prefers-color-scheme: dark) {
            :root {
                --offline-bg: #1a1a2e;
                --offline-surface: #222240;
                --offline-text: #e8e8f0;
                --offline-text-muted: #9a9ab0;
                --offline-border: #3a3a50;
                --offline-shadow: rgba(0, 0, 0, 0.3);
                --offline-primary-light: #4fd1c5;
            }
        }

        /* ==================================================================
           🌍 Global Reset & Base Styles
           ================================================================== */

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background-color: var(--offline-bg);
            color: var(--offline-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================================================================
           📦 Card Container
           ================================================================== */

        .offline-card {
            background-color: var(--offline-surface);
            border: 1px solid var(--offline-border);
            border-radius: 0.75rem;
            box-shadow: 0 4px 24px var(--offline-shadow);
            max-width: 480px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        /* ==================================================================
           📴 Offline Icon
           ================================================================== */

        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            opacity: 0.7;
        }

        .offline-icon svg {
            width: 100%;
            height: 100%;
        }

        /* ==================================================================
           🔤 Typography
           ================================================================== */

        .offline-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--offline-text);
            margin-bottom: 0.5rem;
        }

        .offline-subtitle {
            font-size: 1rem;
            color: var(--offline-text-muted);
            margin-bottom: 1.75rem;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ==================================================================
           🔘 Retry Button
           ================================================================== */

        .offline-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--offline-primary);
            border: 2px solid var(--offline-primary);
            border-radius: 0.5rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease,
                        transform 0.15s ease;
            -webkit-user-select: none;
            user-select: none;
        }

        .offline-btn:hover {
            background-color: var(--offline-primary-dark);
            border-color: var(--offline-primary-dark);
        }

        .offline-btn:active {
            transform: scale(0.97);
        }

        .offline-btn:focus-visible {
            outline: 2px solid var(--offline-primary-light);
            outline-offset: 2px;
        }

        .offline-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ==================================================================
           🏷️ Brand Footer
           ================================================================== */

        .offline-brand {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--offline-text-muted);
        }

        .offline-brand a {
            color: var(--offline-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .offline-brand a:hover {
            text-decoration: underline;
        }

        /* ==================================================================
           📱 Responsive
           ================================================================== */

        @media (max-width: 480px) {
            .offline-card {
                padding: 2rem 1.25rem;
            }

            .offline-title {
                font-size: 1.5rem;
            }

            .offline-icon {
                width: 64px;
                height: 64px;
            }
        }

        /* ==================================================================
           🔄 Subtle Pulse Animation on the Icon
           ================================================================== */

        @keyframes offlinePulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.4; }
        }

        .offline-icon {
            animation: offlinePulse 3s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .offline-icon {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- ====================================================================
         📴 Offline Message Card
         ==================================================================== -->
    <main>
    <div class="offline-card">

        <!-- 📴 Offline icon (inline SVG - no external dependency) -->
        <div class="offline-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                 stroke-linejoin="round" style="color: var(--offline-primary);">
                <!-- Wi-Fi arcs -->
                <path d="M1 9.5A16.09 16.09 0 0 1 12 5c3.04 0 5.87.84 8.29 2.3"/>
                <path d="M5 13.5A8.06 8.06 0 0 1 12 10c1.57 0 3.04.45 4.28 1.23"/>
                <path d="M8.5 17a4.78 4.78 0 0 1 5.36-.56"/>
                <!-- Centre dot -->
                <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
                <!-- Diagonal strike-through -->
                <line x1="2" y1="2" x2="22" y2="22" stroke-width="2"/>
            </svg>
        </div>

        <!-- 📄 Heading and description -->
        <h1 class="offline-title">You are offline</h1>
        <p class="offline-subtitle">
            It looks like you've lost your internet connection.
            Check your network settings and try again.
        </p>

        <!-- 🔄 Retry button -->
        <button type="button" class="offline-btn" onclick="window.location.reload();">
            <!-- Refresh icon (inline SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Try Again
        </button>

        <!-- 🏷️ Brand attribution -->
        <p class="offline-brand">
            <a href="/" aria-label="CueRCode home page">CueRCode</a> &mdash; QR Code Generator
        </p>
    </div>
    </main>

</body>
</html>
