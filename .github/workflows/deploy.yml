# =============================================================================
# 🚀 CueRCode - Deploy via SFTP
# =============================================================================
# Automatically deploys files to the web server via SFTP on push to
# alpha, beta, or main branches.
#
# 📁 Deployment logic:
#   ALL branches upload:
#     - web/ shared folders (excluding web/CueRCode.net/ and web/QRmy.Link/)
#     - web/CueRCode.net/ private folders (no public_html/private_html in name)
#     - web/QRmy.Link/ private folders (when it exists)
#
#   Branch-specific public_html:
#     alpha → public_html_dev_alpha/
#     beta  → public_html_dev_beta/
#     main  → public_html/
#
# 🔐 Authentication:
#   Primary:  SSH key (SFTP_KEY secret)
#   Fallback: Password (SFTP_PASSWORD secret)
#
# 📋 Required GitHub Secrets:
#   SFTP_HOST, SFTP_PORT, SFTP_USER, SFTP_KEY, SFTP_PASSWORD,
#   SFTP_REMOTE_BASE
#
# 📋 Required GitHub Variables:
#   SFTP_ENABLED = 'true'
#
# @see https://github.com/MWBMPartners/phpWhoIs/blob/main/.github/workflows/deploy.yml
# @copyright 2025 MWBM Partners Ltd. All rights reserved.
# =============================================================================

name: Deploy via SFTP

on:
  push:
    branches:
      - main
      - beta
      - alpha

jobs:
  deploy:
    runs-on: ubuntu-latest

    # =========================================================================
    # 🔒 Only run if SFTP deployment is explicitly enabled
    # =========================================================================
    if: ${{ vars.SFTP_ENABLED == 'true' }}

    steps:

      # =======================================================================
      # 📥 Step 1: Checkout the repository
      # =======================================================================
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # =======================================================================
      # 🎯 Step 2: Determine which public_html variant to deploy
      # =======================================================================
      - name: Determine deployment target
        id: target
        run: |
          BRANCH="${{ github.ref_name }}"

          # 🔀 Map branch to the public_html directory suffix
          if [[ "$BRANCH" == "main" ]]; then
            echo "public_html_suffix=public_html" >> $GITHUB_OUTPUT
            echo "channel=production" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "beta" ]]; then
            echo "public_html_suffix=public_html_dev_beta" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "alpha" ]]; then
            echo "public_html_suffix=public_html_dev_alpha" >> $GITHUB_OUTPUT
            echo "channel=alpha" >> $GITHUB_OUTPUT
          fi

          echo "Branch: $BRANCH → deploying public_html variant: $(grep public_html_suffix $GITHUB_OUTPUT | cut -d= -f2)"

      # =======================================================================
      # 📂 Step 3: Prepare deployment staging area
      # Builds a clean staging directory containing only the files that
      # should be uploaded for this branch.
      # =======================================================================
      - name: Prepare deployment staging area
        id: staging
        run: |
          STAGING_DIR="$(pwd)/.deploy_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          PUBLIC_SUFFIX="${{ steps.target.outputs.public_html_suffix }}"
          HAS_FILES="false"

          # 🗂️ Every folder copied into staging below gets one entry here
          #    (source path → the staging path it was copied to). The
          #    ".htaccess" verification check near the end of this step
          #    reads these two arrays back, rather than re-working out which
          #    folders were copied using separate logic that could drift out
          #    of step with the copy loops themselves.
          COPIED_SRC=()
          COPIED_DEST=()

          # =================================================================
          # 📦 Part A: Server-wide shared folders
          # Everything in web/ EXCEPT web/CueRCode.net/ and web/QRmy.Link/
          # =================================================================
          echo "📦 Copying server-wide shared folders..."
          if [[ -d "web/" ]]; then
            for item in web/*/; do
              # 🛡️ If the folder has NO subfolders, bash hands the pattern
              #    through as literal text ("…/*/"), and the copy below would
              #    fail on a path that doesn't exist. Skip that non-folder.
              #    (Found by the #124 review: the old `|| true` used to hide it.)
              [[ -d "$item" ]] || continue
              dir_name=$(basename "$item")

              # ⏭️ Skip the site-specific directories (handled separately)
              if [[ "$dir_name" == "CueRCode.net" ]] || [[ "$dir_name" == "QRmy.Link" ]]; then
                echo "  ⏭️ Skipping web/$dir_name/ (handled separately)"
                continue
              fi

              # ✅ Copy server-wide shared folders
              #
              # 🕳️ Dotfile trap (#124): "$item" always ends in "/" (it comes
              #    from `for item in web/*/`), so the old `"$item"*` expanded
              #    using bash's default globbing — and by default `*` does
              #    NOT match a name starting with a dot. That silently
              #    skipped every top-level dotfile in the folder, including
              #    `.htaccess` (for the shared server-wide folders that is the
              #    deny-all protection; the security headers live in
              #    public_html/.htaccess, copied in Part B), on 16 of the repo's
              #    18 `.htaccess` files. `cp -R "$item". "<dest>/"` copies the
              #    CONTENTS of "$item" — the trailing `/.` means "everything
              #    in this directory, dotfiles included" — rather than the
              #    directory itself, and it works even when the folder is
              #    empty, so no error-suppression is needed for that case.
              #    The old `2>/dev/null || true` also hid every OTHER copy
              #    error (disk full, permissions, …), which would have let a
              #    half-empty deploy go out looking like a success — it has
              #    been removed so a genuine `cp` failure now fails this step
              #    instead of shipping silently broken.
              echo "  ✅ Copying web/$dir_name/"
              mkdir -p "$STAGING_DIR/web/$dir_name"
              cp -R "$item". "$STAGING_DIR/web/$dir_name/"
              COPIED_SRC+=("$item")
              COPIED_DEST+=("$STAGING_DIR/web/$dir_name")
              HAS_FILES="true"
            done
          fi

          # =================================================================
          # 📦 Part B: Site-specific private folders (CueRCode.net)
          # All subfolders that do NOT contain 'public_html' or 'private_html'
          # in the directory name, PLUS the branch-specific public_html
          # =================================================================
          echo ""
          echo "📦 Processing web/CueRCode.net/..."
          if [[ -d "web/CueRCode.net/" ]]; then
            for item in web/CueRCode.net/*/; do
              # 🛡️ If the folder has NO subfolders, bash hands the pattern
              #    through as literal text ("…/*/"), and the copy below would
              #    fail on a path that doesn't exist. Skip that non-folder.
              #    (Found by the #124 review: the old `|| true` used to hide it.)
              [[ -d "$item" ]] || continue
              dir_name=$(basename "$item")

              if [[ "$dir_name" == *"public_html"* ]] || [[ "$dir_name" == *"private_html"* ]]; then
                # 🎯 Only copy the branch-specific public_html variant
                if [[ "$dir_name" == "$PUBLIC_SUFFIX" ]]; then
                  # 🕳️ Same dotfile trap as Part A above (#124) — this is the
                  #    branch's live public_html folder, so its top-level
                  #    .htaccess is the one carrying the rewrite rules and
                  #    Content-Security-Policy/security headers (production)
                  #    or the `Require all denied` block that keeps the
                  #    alpha/beta dev sites private. `cp -R "$item". "<dest>/"`
                  #    (trailing `/.`) copies dotfiles too; the old
                  #    `2>/dev/null || true` is gone so a real copy failure
                  #    fails the step instead of deploying half-empty.
                  echo "  🎯 Copying web/CueRCode.net/$dir_name/ (branch target)"
                  mkdir -p "$STAGING_DIR/web/CueRCode.net/$dir_name"
                  cp -R "$item". "$STAGING_DIR/web/CueRCode.net/$dir_name/"
                  COPIED_SRC+=("$item")
                  COPIED_DEST+=("$STAGING_DIR/web/CueRCode.net/$dir_name")
                  HAS_FILES="true"
                else
                  echo "  ⏭️ Skipping web/CueRCode.net/$dir_name/ (not for this branch)"
                fi
              else
                # ✅ Copy private/shared folders (_functions, _includes, etc.)
                #
                # 🕳️ Same dotfile trap as Part A above (#124) — every one of
                #    these folders (_auth_keys, _includes, _functions,
                #    _libraries, _uploads, _backups) ships a deny-all
                #    `.htaccess`, and the old `"$item"*` glob never staged
                #    it. `cp -R "$item". "<dest>/"` (trailing `/.`) copies
                #    dotfiles too; error-suppression removed so a real copy
                #    failure fails the step rather than deploying quietly
                #    without that protection.
                echo "  ✅ Copying web/CueRCode.net/$dir_name/"
                mkdir -p "$STAGING_DIR/web/CueRCode.net/$dir_name"
                cp -R "$item". "$STAGING_DIR/web/CueRCode.net/$dir_name/"
                COPIED_SRC+=("$item")
                COPIED_DEST+=("$STAGING_DIR/web/CueRCode.net/$dir_name")
                HAS_FILES="true"
              fi
            done

            # 📄 Also copy any root-level files in web/CueRCode.net/ (README, CHANGELOG, etc.)
            # 🛡️ Make sure the destination folder exists first: if this site
            #    folder has no subfolders, nothing above created it, and the
            #    copy below would fail. (Found 2026-09-25 testing the #124
            #    follow-up - the old `2>/dev/null || true` used to hide it.)
            mkdir -p "$STAGING_DIR/web/CueRCode.net"
            find "web/CueRCode.net/" -maxdepth 1 -type f | while read -r file; do
              echo "  📄 Copying $(basename "$file")"
              cp "$file" "$STAGING_DIR/web/CueRCode.net/"
            done
          fi

          # =================================================================
          # 📦 Part C: Site-specific private folders (QRmy.Link)
          # Same logic as CueRCode.net but for QRmy.Link (when it exists)
          # =================================================================
          echo ""
          echo "📦 Processing web/QRmy.Link/..."
          if [[ -d "web/QRmy.Link/" ]]; then
            for item in web/QRmy.Link/*/; do
              # 🛡️ If the folder has NO subfolders, bash hands the pattern
              #    through as literal text ("…/*/"), and the copy below would
              #    fail on a path that doesn't exist. Skip that non-folder.
              #    (Found by the #124 review: the old `|| true` used to hide it.)
              [[ -d "$item" ]] || continue
              dir_name=$(basename "$item")

              if [[ "$dir_name" == *"public_html"* ]] || [[ "$dir_name" == *"private_html"* ]]; then
                if [[ "$dir_name" == "$PUBLIC_SUFFIX" ]]; then
                  # 🕳️ Same dotfile trap as Part A above (#124) — see there
                  #    for why `cp -R "$item". "<dest>/"` (trailing `/.`) is
                  #    used and why the error-suppression is gone.
                  echo "  🎯 Copying web/QRmy.Link/$dir_name/ (branch target)"
                  mkdir -p "$STAGING_DIR/web/QRmy.Link/$dir_name"
                  cp -R "$item". "$STAGING_DIR/web/QRmy.Link/$dir_name/"
                  COPIED_SRC+=("$item")
                  COPIED_DEST+=("$STAGING_DIR/web/QRmy.Link/$dir_name")
                  HAS_FILES="true"
                else
                  echo "  ⏭️ Skipping web/QRmy.Link/$dir_name/ (not for this branch)"
                fi
              else
                # 🕳️ Same dotfile trap as Part A above (#124) — see there
                #    for why `cp -R "$item". "<dest>/"` (trailing `/.`) is
                #    used and why the error-suppression is gone.
                echo "  ✅ Copying web/QRmy.Link/$dir_name/"
                mkdir -p "$STAGING_DIR/web/QRmy.Link/$dir_name"
                cp -R "$item". "$STAGING_DIR/web/QRmy.Link/$dir_name/"
                COPIED_SRC+=("$item")
                COPIED_DEST+=("$STAGING_DIR/web/QRmy.Link/$dir_name")
                HAS_FILES="true"
              fi
            done

            # 📄 Root-level files in web/QRmy.Link/
            # 🛡️ Make sure the destination folder exists first: if this site
            #    folder has no subfolders, nothing above created it, and the
            #    copy below would fail. (Found 2026-09-25 testing the #124
            #    follow-up - the old `2>/dev/null || true` used to hide it.)
            mkdir -p "$STAGING_DIR/web/QRmy.Link"
            find "web/QRmy.Link/" -maxdepth 1 -type f | while read -r file; do
              cp "$file" "$STAGING_DIR/web/QRmy.Link/"
            done
          else
            echo "  ℹ️ web/QRmy.Link/ does not exist yet — skipping"
          fi

          # =================================================================
          # 🔍 Verify every .htaccess made it into staging (#124)
          #
          # This check exists so the dotfile trap explained above the copy
          # lines — or anything like it introduced later — can't come back
          # quietly. Without it, a broken copy would silently ship a site
          # missing its rewrite rules, its Content-Security-Policy/security
          # headers, its `Require all denied` block that keeps the alpha and
          # beta dev sites private, or the deny-all protection on the
          # non-web _auth_keys/_includes/_functions/_libraries/_uploads/
          # _backups folders — and nothing in this workflow's own summary
          # would say so. It would only show up later as a live security
          # problem on the deployed site. For every folder copied above
          # (recorded in the COPIED_SRC/COPIED_DEST arrays as it happened),
          # every .htaccess file that exists in the SOURCE folder must also
          # exist at the same relative path in the STAGED copy.
          # =================================================================
          echo ""
          echo "🔍 Verifying .htaccess files were staged..."
          MISSING=0
          HTACCESS_COUNT=0
          for i in "${!COPIED_SRC[@]}"; do
            src="${COPIED_SRC[$i]}"
            dest="${COPIED_DEST[$i]}"

            # 📄 List every .htaccess under this source folder as a path
            #    relative to the folder itself (e.g. "./.htaccess" or
            #    "./sub/.htaccess"), then confirm the identical relative
            #    path exists in the staged destination folder.
            while IFS= read -r rel; do
              HTACCESS_COUNT=$((HTACCESS_COUNT + 1))
              if [[ ! -f "$dest/$rel" ]]; then
                echo "::error::Missing .htaccess after staging: ${src}${rel#./} (expected at $dest/$rel) — this file is site protection (rewrite rules, security headers, keeping a dev site private, or denying all access to a non-web folder); deploying without it would be a security regression, so the deploy has been stopped here. See issue #124."
                MISSING=1
              fi
            done < <(cd "$src" && find . -name ".htaccess" -type f)
          done

          if [[ "$MISSING" -eq 1 ]]; then
            echo "::error::One or more .htaccess files failed to stage — see the errors above for which ones and why they matter. Deployment stopped before upload."
            exit 1
          fi

          echo "✅ Verified ${HTACCESS_COUNT} .htaccess file(s) staged correctly."

          # =================================================================
          # 📊 Summary
          # =================================================================
          echo ""
          echo "has_files=$HAS_FILES" >> $GITHUB_OUTPUT
          echo "staging_dir=$STAGING_DIR" >> $GITHUB_OUTPUT

          if [[ "$HAS_FILES" == "true" ]]; then
            echo "📊 Staging area contents (first 50 files):"
            # 🛡️ Defensive: `sed -n '1,50p'` rather than `head -50`. head stops
            #    reading after 50 lines, so find can be killed mid-write
            #    (SIGPIPE, exit 141). That is harmless TODAY: steps with no
            #    `shell:` run as `bash -e {0}`, WITHOUT pipefail, so only the
            #    last command of a pipe decides success. It would start
            #    breaking the deploy if anyone ever adds `shell: bash` or
            #    `set -o pipefail` here. sed reads to the end, so it's safe
            #    either way. (Changed 2026-09-25 with #124. An earlier
            #    version of this comment wrongly said pipefail was already on
            #    and that every production deploy was failing - it wasn't;
            #    the #124 review checked this repo's own run logs.)
            #    NOTE, because pipefail is OFF: a failure on the LEFT of any
            #    `find ... | while read` loop in this workflow is not caught.
            find "$STAGING_DIR" -type f | sed -n '1,50p'
            FILE_COUNT=$(find "$STAGING_DIR" -type f | wc -l)
            echo "📊 Total files staged: $FILE_COUNT"
          else
            echo "⚠️ No files to deploy"
          fi

      # =======================================================================
      # 🔢 Step 3b: Inject build/commit info into infoAppVer.php
      # Populates $app["Application"]["Version"]["Repo"]["Commit"] keys
      # and sets Development Status to NULL for production (main) builds
      # =======================================================================
      - name: Inject commit info into infoAppVer.php
        if: steps.staging.outputs.has_files == 'true'
        run: |
          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          COMMIT_DATE=$(git log -1 --format="%cd" --date=format:"%Y-%m-%d %H:%M")
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          # 🔍 Find all infoAppVer.php files in the staging area
          #
          # ⚙️ Marker-based injection (replaces the old fragile literal
          #    `' = NULL'` (UPPERCASE) string-match): each of the four
          #    Repo→Commit assignments in infoAppVer.php carries a stable
          #    trailing anchor comment (`// @build-info: <key>`) instead of
          #    relying on the exact casing/spacing of the right-hand side
          #    value. This means the assignments can be house-standard
          #    lowercase `null` (matching every other null in the file) and
          #    the file can be reflowed/reindented without silently breaking
          #    the injection — only the anchor comment text is load-bearing.
          #    See web/CueRCode.net/public_html/infoAppVer.php header comment.
          find "$STAGING_DIR" -name "infoAppVer.php" -type f | while read -r VERFILE; do
            echo "📝 Injecting build info into: ${VERFILE#$STAGING_DIR/}"

            # 🔗 Inject full commit SHA
            sed -i "s|= null; // @build-info: commit-sha-full|= \"${COMMIT_SHA}\"; // @build-info: commit-sha-full|" "$VERFILE"

            # 🔗 Inject short SHA
            sed -i "s|= null; // @build-info: commit-sha-short|= \"${SHORT_SHA}\"; // @build-info: commit-sha-short|" "$VERFILE"

            # 📅 Inject commit date
            sed -i "s|= null; // @build-info: commit-date|= \"${COMMIT_DATE}\"; // @build-info: commit-date|" "$VERFILE"

            # 🔗 Inject commit URL
            sed -i "s|= null; // @build-info: commit-url|= \"${REPO_URL}/commit/${COMMIT_SHA}\"; // @build-info: commit-url|" "$VERFILE"

            # 🏷️ For production (main) builds, clear the Development Status
            if [[ "$BRANCH" == "main" ]]; then
              sed -i '/\["Development"\]\["Status"\]/{ s/= "Alpha"/= null/; s/= "Beta"/= null/ }' "$VERFILE"
              echo "  🏷️ Development Status set to null (production)"
            fi

            # ✅ Verify
            echo "  ✅ Commit: ${SHORT_SHA} @ ${COMMIT_DATE}"
          done

      # =======================================================================
      # 🗜️ Step 4: Minify JS, CSS, and HTML before upload
      # =======================================================================
      - name: Install minification tools
        if: steps.staging.outputs.has_files == 'true'
        run: |
          npm install -g terser clean-css-cli html-minifier-terser

      - name: Minify files before upload
        if: steps.staging.outputs.has_files == 'true'
        run: |
          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"

          # 🚫 Never re-minify third-party code under assets/vendor/ - today that
          #    means the committed Swagger UI copy at
          #    public_html/assets/vendor/swagger-ui/ (Bootstrap and jQuery live
          #    there on the server too, but they're gitignored and uploaded by
          #    hand, so the deploy never has them). Those files are already
          #    minified upstream, and the Swagger UI copy is promised elsewhere
          #    in the repo (its own README, and api/docs/index.php) to be the
          #    unmodified pinned 5.33.0 release — running it back through our
          #    minifiers gains nothing and risks silently corrupting the local
          #    fallback for the API docs page. `-not -path '*/assets/vendor/*'`
          #    below excludes any file anywhere under an assets/vendor/ folder,
          #    for any site (CueRCode.net, QRmy.Link, etc).

          # 🟡 Minify JavaScript files
          find "$STAGING_DIR" -name "*.js" -type f -not -path '*/assets/vendor/*' 2>/dev/null | while read -r file; do
            echo "🟡 Minifying JS: ${file#"$STAGING_DIR"/}"
            terser "$file" --compress --mangle --output "$file" 2>/dev/null || echo "  ⚠️ Warning: failed to minify $file"
          done

          # 🔵 Minify CSS files
          find "$STAGING_DIR" -name "*.css" -type f -not -path '*/assets/vendor/*' 2>/dev/null | while read -r file; do
            echo "🔵 Minifying CSS: ${file#"$STAGING_DIR"/}"
            cleancss -o "$file" "$file" 2>/dev/null || echo "  ⚠️ Warning: failed to minify $file"
          done

          # 🟠 Minify HTML files
          find "$STAGING_DIR" \( -name "*.html" -o -name "*.htm" \) -type f -not -path '*/assets/vendor/*' 2>/dev/null | while read -r file; do
            echo "🟠 Minifying HTML: ${file#"$STAGING_DIR"/}"
            html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o "$file" "$file" 2>/dev/null || echo "  ⚠️ Warning: failed to minify $file"
          done

          # 🟣 Minify XML files (strip whitespace between tags)
          find "$STAGING_DIR" -name "*.xml" -type f -not -path '*/assets/vendor/*' 2>/dev/null | while read -r file; do
            echo "🟣 Minifying XML: ${file#"$STAGING_DIR"/}"
            sed -i 's/>[[:space:]]*</></g' "$file" 2>/dev/null || echo "  ⚠️ Warning: failed to minify $file"
          done

      # =======================================================================
      # 🔐 Step 5: Determine authentication method
      # Primary: SSH key | Fallback: Password
      # =======================================================================
      - name: Check auth method
        if: steps.staging.outputs.has_files == 'true'
        id: auth
        run: |
          if [[ -n "${{ secrets.SFTP_KEY }}" ]]; then
            echo "method=key" >> $GITHUB_OUTPUT
            echo "🔑 Using SSH key authentication"
          else
            echo "method=password" >> $GITHUB_OUTPUT
            echo "🔒 Using password authentication (SSH key not set)"
          fi

      # =======================================================================
      # 🚀 Step 6a: Deploy via SFTP using SSH key (primary)
      # =======================================================================
      - name: Install lftp
        if: steps.staging.outputs.has_files == 'true'
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP (SSH key)
        if: steps.staging.outputs.has_files == 'true' && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          STAGING_DIR: ${{ steps.staging.outputs.staging_dir }}
          REMOTE_BASE: ${{ secrets.SFTP_REMOTE_BASE }}
        run: |
          # 🔑 Write SSH key to file
          mkdir -p ~/.ssh
          echo "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 🚀 Upload using lftp mirror
          cat > /tmp/lftp_script.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          mirror --reverse --verbose --only-newer --no-empty-dirs \
            --exclude .DS_Store \
            --exclude .gitkeep \
            --exclude .gitignore \
            --exclude README.md \
            --exclude CHANGELOG.md \
            --exclude DEV_NOTES.md \
            ${STAGING_DIR}/web/ ${REMOTE_BASE}
          bye
          LFTP_EOF

          echo "🚀 Deploying to ${SFTP_HOST}:${REMOTE_BASE}..."
          lftp -f /tmp/lftp_script.txt

          # 🧹 Clean up SSH key
          rm -f ~/.ssh/deploy_key

      # =======================================================================
      # 🚀 Step 6b: Deploy via SFTP using password (fallback)
      # =======================================================================
      - name: Deploy via SFTP (password)
        if: steps.staging.outputs.has_files == 'true' && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          STAGING_DIR: ${{ steps.staging.outputs.staging_dir }}
          REMOTE_BASE: ${{ secrets.SFTP_REMOTE_BASE }}
        run: |
          echo "🚀 Deploying to ${SFTP_HOST}:${REMOTE_BASE}..."
          lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; \
            mirror --reverse --verbose --only-newer --no-empty-dirs \
            --exclude .DS_Store \
            --exclude .gitkeep \
            --exclude .gitignore \
            --exclude README.md \
            --exclude CHANGELOG.md \
            --exclude DEV_NOTES.md \
            ${STAGING_DIR}/web/ ${REMOTE_BASE}; \
            bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}"

      # =======================================================================
      # 📊 Step 7: Deployment summary
      # =======================================================================
      - name: Deployment summary
        if: steps.staging.outputs.has_files == 'true'
        run: |
          FILE_COUNT=$(find "${{ steps.staging.outputs.staging_dir }}" -type f | wc -l)
          echo "### 🚀 Deployed to ${{ steps.target.outputs.channel }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Channel** | ${{ steps.target.outputs.channel }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Public HTML** | \`${{ steps.target.outputs.public_html_suffix }}/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Files uploaded** | $FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auth method** | ${{ steps.auth.outputs.method }} |" >> $GITHUB_STEP_SUMMARY

      - name: Skip summary
        if: steps.staging.outputs.has_files == 'false'
        run: |
          echo "### ⏭️ No deployment needed" >> $GITHUB_STEP_SUMMARY
          echo "No deployable files found for branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      # =======================================================================
      # 🧹 Step 8: Cleanup staging area
      # =======================================================================
      - name: Cleanup staging area
        if: always()
        run: |
          rm -rf "${{ steps.staging.outputs.staging_dir }}" 2>/dev/null || true
          rm -f /tmp/lftp_script.txt 2>/dev/null || true
