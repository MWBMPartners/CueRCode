# =============================================================================
# ✅ CueRCode - Continuous Integration (PR quality gate)
# =============================================================================
# Runs on push/PR to all four tiers (alpha → beta → release-candidate → main).
# Provides the per-PR quality signal the repo previously lacked
# (closes #35 / roadmap E12):
#   1. php -l syntax lint on PHP 8.4, 8.5 AND 8.6 (supported versions, decision
#      0002; lint also fails on compile-time deprecations, #151)
#   2. The dependency-free test suite (php tests/run.php) on all three versions.
#      The QR/PDF/barcode libraries are committed in _libraries/ (decision 0011);
#      a pin check verifies them instead of downloading anything.
#   3. Site polish check (php tools/check_site_polish.php, #137).
#   4. Secret scan via the gitleaks CLI (the org-licensed gitleaks *action*
#      silently no-ops on private repos without a licence — the CLI does not).
#
# @copyright 2025-2026 MWBM Partners Ltd. All rights reserved.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - release-candidate
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - release-candidate
      - beta
      - alpha

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 🔤 php -l syntax lint across the supported PHP versions
  # ---------------------------------------------------------------------------
  php-lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # ⏱️ A hung job must not hold the queue for the 6-hour default.
    timeout-minutes: 20
    # 🧪 PHP 8.6 is due for general availability on 2026-11-19. Until setup-php's
    #    `latest` is 8.6 or higher it may serve a release candidate or nightly build.
    #    Its result is REPORTED but must not block merges for now (#151,
    #    decision 0002). A red 8.6 run is not ignored: the watchdog reports it.
    #    To make 8.6 blocking: once setup-php's `latest` is 8.6 or higher AND
    #    8.6 has passed two runs in a row, delete the `continue-on-error` lines
    #    (here and in the tests job and deploy.yml) in one commit and record a
    #    new decision.
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
          - '8.6'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # One shared script (also used by deploy.yml) so the two cannot drift.
      # It fails on syntax errors AND on compile-time "Deprecated:" output.
      - name: Lint every PHP file
        run: bash tools/ci/php-lint.sh

  # ---------------------------------------------------------------------------
  # 🧪 Dependency-free test suite (libraries committed, pin-checked)
  # ---------------------------------------------------------------------------
  tests:
    name: Test suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # ⏱️ A hung job must not hold the queue for the 6-hour default.
    timeout-minutes: 20
    # 🧪 8.6 is allowed to fail for now (see the php-lint job for the rule).
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
          - '8.6'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 🔎 Three possible situations here, and they must NOT be treated the
      #    same way:
      #      1. tests/run.php exists → the normal case, run the suite.
      #      2. The tests/ folder exists but tests/run.php does not → the
      #         test runner has been deleted or renamed on this branch. A
      #         pull request that deletes tests/run.php must NOT still show
      #         a green "Test suite" check - that would be a silent failure,
      #         the check lying about whether the code was tested. Fail.
      #      3. The tests/ folder does not exist at ALL. Usually that means
      #         an older tier (e.g. release-candidate before alpha is
      #         promoted into it) that genuinely predates the test suite:
      #         skip with a visible notice; the suite switches on by itself
      #         once tests/ arrives via promotion (#110). BUT git does not
      #         keep empty folders, so a pull request that deletes the WHOLE
      #         tests/ folder lands here too. So on a pull request we ask the
      #         TARGET branch: if it has tests/run.php, this PR is removing
      #         the suite → fail. (Found by the 2026-09-25 review, round 2.)
      #         If the target can't be checked, fail rather than guess.
      #         The fetch names the branch in full (refs/heads/...) because
      #         for a short name git would prefer a TAG called the same.
      #         Limit: a direct push (no pull request) that deletes tests/
      #         still only skips. Nothing stops such a push today: alpha,
      #         beta and release-candidate only block deleting the branch,
      #         and repository admins can bypass main's pull-request rule
      #         (checked 2026-09-25). Stricter branch protection, and making
      #         "Test suite" a required check, are owner decisions (see
      #         LAUNCH_DECISIONS.md).
      - name: Check the test suite is present on this branch
        id: suite
        env:
          # Via env, never ${{ }} inside the script (standard injection guard).
          # Empty on push events; the PR's target branch on pull requests.
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -f tests/run.php ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [ -d tests ]; then
            echo "::error::tests/run.php is missing but the tests/ folder exists — the test runner has been deleted or renamed. The test suite cannot run; fix the branch rather than letting this check pass silently."
            exit 1
          else
            if [ -n "${BASE_REF}" ]; then
              if ! git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"; then
                echo "::error::There is no tests/ folder, and the target branch '${BASE_REF}' could not be fetched to check whether it has the test suite. Re-run the check."
                exit 1
              fi
              if git cat-file -e FETCH_HEAD:tests/run.php 2>/dev/null; then
                echo "::error::The target branch '${BASE_REF}' has the test suite (tests/run.php), but this pull request removes the whole tests/ folder."
                exit 1
              fi
            fi
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::tests/ is not on this branch yet — test suite skipped (it arrives via promotion)."
          fi

      - name: Set up PHP ${{ matrix.php }}
        if: steps.suite.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, zip, fileinfo, bcmath
          coverage: none
          # Report everything, so the child processes some tests start also
          # print deprecations (#151).
          ini-values: error_reporting=-1, display_errors=On, log_errors=Off

      # Decision 0011 (#113): the QR/PDF/barcode libraries are COMMITTED in
      # web/CueRCode.net/_libraries/, so the checkout already has them. This
      # step proves the committed copies are exactly the pinned versions
      # (PINNED_VERSIONS.json) instead of downloading anything. To upgrade a
      # library deliberately, replace the files, run
      # `php tools/check_vendored_libraries.php --update`, review the diff.
      - name: Check committed libraries match the pinned versions
        if: steps.suite.outputs.present == 'true'
        run: php tools/check_vendored_libraries.php

      # The runner exits 1 on a deprecation it catches itself, and the test
      # helpers that spawn child PHP processes fail on a deprecation in the
      # child (STDERR marker + exit 255, see tests/bootstrap.php). The grep
      # below is a backstop for deprecation text that still reaches the log.
      - name: Run test suite
        if: steps.suite.outputs.present == 'true'
        run: |
          set -o pipefail
          php tests/run.php 2>&1 | tee test-output.txt
          if grep -nE '(^|PHP )Deprecated:' test-output.txt; then
            echo "::error::PHP deprecation text found in the test output."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 🔍 Site polish check (#137) — BLOCKING. Source-only checks for the small
  #     details that make the site look unfinished or machine-made: preview
  #     addresses, per-page titles/descriptions, share tags, CDN integrity
  #     hashes vs the committed fallback copies, leftover console.log, missing
  #     alt text, broken/".php" links, sitemap coverage, custom error pages,
  #     HTML comments shipped to visitors, stock phrases, en-GB, CSS grid
  #     overflow. No database or web server needed. Branches that don't have
  #     the script yet (before promotion) skip with a notice.
  # ---------------------------------------------------------------------------
  site-polish:
    name: Site polish check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Run the site polish check
        run: |
          if [ ! -f tools/check_site_polish.php ]; then
            echo "::notice::tools/check_site_polish.php is not on this branch yet - skipping the polish check."
            exit 0
          fi
          php tools/check_site_polish.php

  # ---------------------------------------------------------------------------
  # 🔐 Secret scan (gitleaks CLI) — BLOCKING. The baseline is clean under
  #     .gitleaks.toml (which allowlists reviewed false positives: docs prose,
  #     dev-portal example curl commands, OpenAPI text, docblock example tokens,
  #     the test fixture). A genuinely leaked secret will now fail the build.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 📌 Pinned version + checksum. This used to ask api.github.com for the
      #    "latest" release without logging in; GitHub rate-limits those
      #    anonymous calls per runner IP, so the step randomly died with a 403
      #    before scanning anything (alpha CI, 2026-10-19). Pinning also means
      #    an unverified new release can't silently change what CI runs.
      #    Dependabot can't bump this — to upgrade, change both values below,
      #    taking the SHA-256 from that release's gitleaks_<ver>_checksums.txt.
      - name: Run gitleaks (pinned release)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          echo "gitleaks version: ${GITLEAKS_VERSION}"
          curl -sSfL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
