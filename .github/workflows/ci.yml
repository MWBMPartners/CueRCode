# =============================================================================
# ✅ CueRCode - Continuous Integration (PR quality gate)
# =============================================================================
# Runs on push/PR to all four tiers (alpha → beta → release-candidate → main).
# Provides the per-PR quality signal the repo previously lacked
# (closes #35 / roadmap E12):
#   1. php -l syntax lint on BOTH PHP 8.4 and 8.5 (target = 8.5, back-compat 8.4)
#   2. The dependency-free test suite (php tests/run.php) with the vendored
#      QR/PDF libraries installed at run time (they are gitignored — "downloaded
#      separately, not committed" — so CI fetches them, mirroring the server).
#   3. Secret scan via the gitleaks CLI (the org-licensed gitleaks *action*
#      silently no-ops on private repos without a licence — the CLI does not).
#
# @copyright 2025-2026 MWBM Partners Ltd. All rights reserved.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - release-candidate
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - release-candidate
      - beta
      - alpha

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 🔤 php -l syntax lint across the supported PHP versions
  # ---------------------------------------------------------------------------
  php-lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          fail=0
          # Only scan folders that exist — an older tier (e.g. release-candidate
          # before alpha is promoted into it) may not have tests/ yet (#110).
          DIRS=()
          for d in web tests; do
            if [ -d "${d}" ]; then
              DIRS+=("${d}")
            fi
          done
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=${file}::PHP syntax error"
              php -l "$file" || true
              fail=1
            fi
          done < <(find "${DIRS[@]}" -name '*.php' -type f)
          if [ "${fail}" -ne 0 ]; then
            echo "PHP syntax errors found."
            exit 1
          fi
          echo "php -l clean across all tracked PHP files."

  # ---------------------------------------------------------------------------
  # 🧪 Dependency-free test suite (libraries vendored at run time)
  # ---------------------------------------------------------------------------
  tests:
    name: Test suite (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # 🔎 Three possible situations here, and they must NOT be treated the
      #    same way:
      #      1. tests/run.php exists → the normal case, run the suite.
      #      2. The tests/ folder exists but tests/run.php does not → the
      #         test runner has been deleted or renamed on this branch. A
      #         pull request that deletes tests/run.php must NOT still show
      #         a green "Test suite" check - that would be a silent failure,
      #         the check lying about whether the code was tested. Fail.
      #      3. The tests/ folder does not exist at ALL. Usually that means
      #         an older tier (e.g. release-candidate before alpha is
      #         promoted into it) that genuinely predates the test suite:
      #         skip with a visible notice; the suite switches on by itself
      #         once tests/ arrives via promotion (#110). BUT git does not
      #         keep empty folders, so a pull request that deletes the WHOLE
      #         tests/ folder lands here too. So on a pull request we ask the
      #         TARGET branch: if it has tests/run.php, this PR is removing
      #         the suite → fail. (Found by the 2026-09-25 review, round 2.)
      #         If the target can't be checked, fail rather than guess.
      #         Limit: a direct push (no pull request) that deletes tests/
      #         still only skips - branch protection should make that
      #         impossible on the four tiers.
      - name: Check the test suite is present on this branch
        id: suite
        env:
          # Via env, never ${{ }} inside the script (standard injection guard).
          # Empty on push events; the PR's target branch on pull requests.
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -f tests/run.php ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [ -d tests ]; then
            echo "::error::tests/run.php is missing but the tests/ folder exists — the test runner has been deleted or renamed. The test suite cannot run; fix the branch rather than letting this check pass silently."
            exit 1
          else
            if [ -n "${BASE_REF}" ]; then
              if ! git fetch --no-tags --depth=1 origin "${BASE_REF}"; then
                echo "::error::There is no tests/ folder, and the target branch '${BASE_REF}' could not be fetched to check whether it has the test suite. Re-run the check."
                exit 1
              fi
              if git cat-file -e FETCH_HEAD:tests/run.php 2>/dev/null; then
                echo "::error::The target branch '${BASE_REF}' has the test suite (tests/run.php), but this pull request removes the whole tests/ folder."
                exit 1
              fi
            fi
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::tests/ is not on this branch yet — test suite skipped (it arrives via promotion)."
          fi

      - name: Set up PHP 8.4
        if: steps.suite.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, zip, fileinfo, bcmath
          coverage: none

      - name: Install vendored libraries (no Composer, mirrors the server)
        if: steps.suite.outputs.present == 'true'
        run: |
          set -euo pipefail
          LIB="web/CueRCode.net/_libraries"
          git clone --depth 1 --branch 5.0.5 https://github.com/chillerlan/php-qrcode.git /tmp/php-qrcode
          git clone --depth 1 --branch 3.2.1 https://github.com/chillerlan/php-settings-container.git /tmp/php-settings-container
          git clone --depth 1 https://github.com/Setasign/FPDF.git /tmp/fpdf
          git clone --depth 1 --branch 2.12.0 https://github.com/tecnickcom/tc-lib-barcode.git /tmp/tc-lib-barcode
          git clone --depth 1 --branch 2.13.1 https://github.com/tecnickcom/tc-lib-color.git /tmp/tc-lib-color
          mkdir -p "${LIB}/chillerlan/php-qrcode" "${LIB}/chillerlan/php-settings-container" "${LIB}/fpdf" "${LIB}/tecnickcom/tc-lib-barcode" "${LIB}/tecnickcom/tc-lib-color"
          cp -r /tmp/php-qrcode/src "${LIB}/chillerlan/php-qrcode/src"
          cp -r /tmp/php-settings-container/src "${LIB}/chillerlan/php-settings-container/src"
          cp -r /tmp/fpdf/. "${LIB}/fpdf/"
          cp -r /tmp/tc-lib-barcode/src "${LIB}/tecnickcom/tc-lib-barcode/src"
          cp -r /tmp/tc-lib-color/src "${LIB}/tecnickcom/tc-lib-color/src"
          echo "Vendored libraries installed."

      - name: Run test suite
        if: steps.suite.outputs.present == 'true'
        run: php tests/run.php

  # ---------------------------------------------------------------------------
  # 🔐 Secret scan (gitleaks CLI) — BLOCKING. The baseline is clean under
  #     .gitleaks.toml (which allowlists reviewed false positives: docs prose,
  #     dev-portal example curl commands, OpenAPI text, docblock example tokens,
  #     the test fixture). A genuinely leaked secret will now fail the build.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Run gitleaks (latest release)
        run: |
          set -euo pipefail
          VER="$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"
          echo "gitleaks version: ${VER}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
