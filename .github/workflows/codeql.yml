# =============================================================================
# 🛡️ CueRCode - CodeQL code scanning (multi-branch)
# =============================================================================
# Static security analysis via GitHub CodeQL, running on all three tiers
# (alpha → beta → main) so a code-level vulnerability is caught on every
# branch, not just the default one.
#
# ⚠️ Language coverage: CodeQL does NOT support PHP. This repo's analysable
#    CodeQL surface is the browser JavaScript under public_html*/assets/js/
#    (+ the service worker). PHP static analysis is handled separately by the
#    php -l matrix + test suite (+ future PHPStan) — see .github/workflows/ci.yml
#    and issue #35 / roadmap E12. Secret scanning is covered by GitHub-native
#    secret scanning (owner-enabled) and the gitleaks CI job.
#
# A workflow file must physically exist on a branch for push/PR scans of that
# branch to run; the scheduled scan runs from the default branch.
#
# @see https://docs.github.com/en/code-security/code-scanning
# @copyright 2025-2026 MWBM Partners Ltd. All rights reserved.
# =============================================================================

name: CodeQL

on:
  push:
    branches:
      - main
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - beta
      - alpha
  schedule:
    # Weekly, Monday 04:17 UTC (off the hour to avoid the scheduler rush).
    - cron: '17 4 * * 1'

# Least-privilege default; the analyse job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest

    # ⏳ TRANSITIONAL: CodeQL result upload requires GitHub Advanced Security /
    #    "Code Security" to be enabled on this PRIVATE repo. Until it is, the
    #    upload step reports a configuration error. `continue-on-error` keeps
    #    that from failing the PR while GHAS is being enabled. The analysis
    #    still runs; once GHAS is on, results appear in the Security tab.
    #    ➡️ REMOVE this line once GHAS is enabled so CodeQL failures block again.
    continue-on-error: true

    permissions:
      # Required to upload the SARIF results to the Security tab.
      security-events: write
      # Required by CodeQL to read the Actions run metadata.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # PHP is unsupported by CodeQL; JavaScript/TypeScript is our surface.
        language:
          - javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 'security-extended' widens the query set beyond the default.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
